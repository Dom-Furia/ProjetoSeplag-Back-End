#Importe necessario para funcionamento das variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]

spring.application.name=api
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# MinIO
minio.url=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ROOT_USER}
minio.secret-key=${MINIO_ROOT_PASSWORD}
minio.bucket=${MINIO_BUCKET}



#Configuration do JWT
api.security.token.secret=${TOKEN_SECRET}
api.security.token.expiration=${JWT_EXPIRATION}
api.security.refresh.expiration=${JWT_EXPIRATION_REFRESH}

# Actuator
# Mostrar detalhes
management.endpoint.health.show-details=always

# Desabilita health checks automaticos
management.health.diskspace.enabled=false
management.health.db.enabled=false
management.health.ssl.enabled=false
management.health.ping.enabled=false


# Timeout para obter conex\uFFFDo
spring.datasource.hikari.connection-timeout=2000

# Timeout para validar conex\uFFFDo
spring.datasource.hikari.validation-timeout=1000


